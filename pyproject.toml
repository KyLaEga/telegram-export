# ── Native .app packaging (Phase 3) — BeeWare Briefcase ──────────────────────────
#
#   venv/bin/python3.12 -m briefcase create macOS
#   venv/bin/python3.12 -m briefcase build  macOS
#   venv/bin/python3.12 -m briefcase run    macOS          # run the built .app
#   venv/bin/python3.12 -m briefcase package macOS --adhoc-sign   # .dmg, local (unsigned)
#
# Briefcase bundles the packages/modules listed in `sources` as-is; entry point is
# gui/__main__.py (which runs gui.app.main()). Add a custom icon later via `icon=`.

[tool.briefcase]
project_name = "Telegram Export"
bundle = "com.telegramexport"
version = "0.3.1"
url = "https://github.com/KyLaEga/telegram-export"
license = "MIT"
license-files = ["LICENSE"]
author = "KyLaEga"
author_email = "ivan2002k15@gmail.com"

[tool.briefcase.app.telegram-export]
formal_name = "Telegram Export"
description = "Native app to export and upload Telegram media"
long_description = """
Telegram Export is a desktop app over the proven export_media.py engine:
sign in, choose download options, watch live multi-worker progress, review
duplicates, and a separate pipeline to upload a folder back to a channel.
Dark/light theme and English/Russian, switchable at runtime.
"""
icon = "gui/resources/appicon"   # gui/resources/appicon.icns (macOS app icon)

# Entry point: the `telegram_export` package (its __main__.py runs gui.app.main()).
# Briefcase requires a source package whose name matches the app name.
sources = [
    "telegram_export",
    "gui",
    "export_media.py",
    "uploader.py",
    "fast_download.py",
]
test_sources = [
    "tests",
]

requires = [
    "Pyrogram==2.0.106",
    # TgCrypto is an OPTIONAL C-extension speedup for Pyrogram with no wheel for the
    # bundled Python; Pyrogram falls back to pure-Python pyaes (below), so it is
    # omitted from the .app bundle. Keep it in requirements.txt for running from source.
    # PySide6: the Briefcase standalone Python only has wheels up to 6.7.x (6.8+ needs a
    # higher macOS target); the app uses only stable APIs, so 6.7.3 is bundled. The dev
    # environment (requirements.txt) keeps 6.11.1.
    "PySide6==6.7.3",
    # pyaes ships sdist-only; Briefcase installs with `--only-binary :all:`, so we
    # bundle a locally-built pure-Python wheel (see wheelhouse/, committed).
    "wheelhouse/pyaes-1.6.1-py3-none-any.whl",
    "PySocks==1.7.1",
]

[tool.briefcase.app.telegram-export.macOS]
# Universal2 (Intel + Apple Silicon): all our deps ship universal2 / pure-python
# wheels (PySide6 universal2; Pyrogram/PySocks/pyaes are py3-none-any), so the
# bundle runs natively on both architectures.
universal_build = true
requires = [
    "std-nslog~=1.0",
]
