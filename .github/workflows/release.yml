name: release

# Builds the native app on each OS's own runner (Briefcase cannot cross-compile)
# and publishes the artifacts to the GitHub Release for the pushed tag (e.g. v0.3.0).
# Manual runs (workflow_dispatch) build + upload workflow artifacts but don't release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip briefcase
      - run: python -m briefcase create macOS --no-input
      - run: python -m briefcase build macOS --no-input
      - run: python -m briefcase package macOS --adhoc-sign --no-input
      - run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  windows:
    name: Build Windows (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip briefcase
      - run: python -m briefcase create windows --no-input
      - run: python -m briefcase build windows --no-input
      - run: python -m briefcase package windows --no-input
      - run: dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries (Qt runtime + AppImage FUSE)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libegl1 libgl1 libxkbcommon0 \
            libxcb-cursor0 libdbus-1-3 libglib2.0-0 libfontconfig1
      - run: python -m pip install --upgrade pip briefcase
      - run: python -m briefcase create linux appimage --no-input --no-docker
      - run: python -m briefcase build linux appimage --no-input --no-docker
      - run: python -m briefcase package linux appimage --no-input --no-docker
      - run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
