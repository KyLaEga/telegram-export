name: release

# Builds the native app on each OS's own runner (Briefcase cannot cross-compile)
# and publishes the artifacts to the GitHub Release for the pushed tag (e.g. v0.3.0).
# Manual runs (workflow_dispatch) build + upload workflow artifacts but don't release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip briefcase
      - run: python -m briefcase create macOS --no-input
      - run: python -m briefcase build macOS --no-input
      - name: Trim unused Qt modules (app is pure QtWidgets — needs only Core/Gui/Widgets/DBus)
        # The app imports only QtCore/QtGui/QtWidgets; QtGui hard-links QtDBus on macOS, so
        # those four frameworks are the entire dependency closure (verified locally with
        # `otool -L`). Everything else PySide6-Essentials ships — QML/Quick, Designer, the
        # virtual-keyboard/TUIO input plugins that drag in the whole QML stack, sqldrivers,
        # translations — is dead weight. Removing it cuts the bundle ~30% before thinning.
        run: |
          APP="build/telegram-export/macos/app/Telegram Export.app"
          PYS="$APP/Contents/Resources/app_packages/PySide6"; QT="$PYS/Qt"; QTLIB="$QT/lib"
          before=$(du -sh "$APP" | cut -f1)
          for fw in "$QTLIB"/*.framework; do
            case "$(basename "$fw" .framework)" in
              QtCore|QtGui|QtWidgets|QtDBus) ;; *) rm -rf "$fw";;
            esac
          done
          for so in "$PYS"/Qt*.abi3.so; do
            case "$(basename "$so" | cut -d. -f1)" in
              QtCore|QtGui|QtWidgets) ;; *) n=$(basename "$so" | cut -d. -f1); rm -f "$so" "$PYS/$n.pyi";;
            esac
          done
          rm -rf "$QT/qml" "$QT/translations" "$QT/metatypes"
          for d in platforminputcontexts generic sqldrivers qmltooling designer \
                   qmllint networkinformation tls iconengines; do
            rm -rf "$QT/plugins/$d"
          done
          rm -f "$QT/plugins/imageformats/libqpdf.dylib" "$QT/plugins/imageformats/libqsvg.dylib"
          echo "Qt trim: $before -> $(du -sh "$APP" | cut -f1)"
      - name: Thin universal2 → arm64 (ARM-only build halves PySide6 size)
        run: |
          APP="build/telegram-export/macos/app/Telegram Export.app"
          n=0
          while IFS= read -r f; do
            if file "$f" 2>/dev/null | grep -q "Mach-O universal binary"; then
              lipo "$f" -thin arm64 -output "$f.__thin" 2>/dev/null && mv -f "$f.__thin" "$f" && n=$((n+1)) || true
            fi
          done < <(find "$APP" -type f)
          echo "thinned $n fat binaries to arm64"
      - run: python -m briefcase package macOS --adhoc-sign --no-input
      - run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  windows:
    name: Build Windows (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip briefcase
      - run: python -m briefcase create windows --no-input
      - run: python -m briefcase build windows --no-input
      - run: python -m briefcase package windows --no-input
      - run: dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries (Qt runtime + AppImage FUSE)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libegl1 libgl1 libxkbcommon0 \
            libxcb-cursor0 libdbus-1-3 libglib2.0-0 libfontconfig1
      - run: python -m pip install --upgrade pip briefcase
      - run: python -m briefcase create linux appimage --no-input --no-docker
      - run: python -m briefcase build linux appimage --no-input --no-docker
      - run: python -m briefcase package linux appimage --no-input --no-docker
      - run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
